<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prime Chat</title>
<style>
:root{--bg:#07111f;--panel:#0d1b2d;--panel2:#10243a;--line:#1e3955;--accent:#20c997;--text:#eef6ff;--muted:#91a8bf;--danger:#ff5d73}
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:radial-gradient(circle at top,#12304a,#07111f 55%);color:var(--text);height:100vh;overflow:hidden}
button,input{font:inherit}.hidden{display:none!important}
.auth{height:100vh;display:grid;place-items:center;padding:20px}.auth-card{width:min(420px,100%);background:rgba(13,27,45,.92);border:1px solid var(--line);border-radius:28px;padding:30px;box-shadow:0 25px 80px #0008}
.logo{text-align:center;font-size:34px;font-weight:900}.sub{text-align:center;color:var(--muted);margin:8px 0 26px}
.field{margin:12px 0}.field label{display:block;color:#c9d8e8;margin-bottom:7px}.field input{width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);background:#081522;color:white;outline:none}.field input:focus{border-color:var(--accent)}
.primary{width:100%;padding:14px;border:0;border-radius:14px;background:var(--accent);color:#042219;font-weight:900;cursor:pointer;margin-top:10px}.switch{border:0;background:none;color:#69d9ff;cursor:pointer;margin-top:16px;width:100%}.error{min-height:22px;color:var(--danger);text-align:center;margin-top:10px}
.app{height:100vh;display:grid;grid-template-columns:330px 1fr}.sidebar{background:rgba(13,27,45,.96);border-left:1px solid var(--line);display:flex;flex-direction:column}.side-head{padding:20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;font-size:22px}.me{padding:12px 20px;color:var(--muted);border-bottom:1px solid var(--line);font-size:14px}.search{margin:14px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:#081522;color:white;outline:none}.users{overflow:auto;padding:0 8px 12px}.user{width:100%;border:0;background:transparent;color:white;display:flex;gap:12px;align-items:center;padding:13px;border-radius:15px;cursor:pointer;text-align:right}.user:hover,.user.active{background:var(--panel2)}.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#20c997,#3498db);font-weight:900;flex:none}.uinfo{min-width:0;flex:1}.uname{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{font-size:12px;color:var(--muted);margin-top:4px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#66798a;margin-left:5px}.dot.on{background:#20c997}
.chat{display:flex;flex-direction:column;min-width:0}.chat-head{height:75px;padding:12px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;background:#0b1a2b}.chat-title{font-weight:900}.chat-status{font-size:12px;color:var(--muted);margin-top:4px}.messages{flex:1;overflow:auto;padding:25px;display:flex;flex-direction:column;gap:8px;background:linear-gradient(#081522aa,#07111fcc)}.empty{margin:auto;text-align:center;color:var(--muted)}.bubble{max-width:min(70%,600px);padding:11px 14px;border-radius:18px;line-height:1.6;word-break:break-word}.mine{align-self:flex-start;background:#075e54;border-bottom-left-radius:5px}.theirs{align-self:flex-end;background:#18304a;border-bottom-right-radius:5px}.time{font-size:10px;color:#b7c8d7;margin-top:4px}.composer{display:flex;gap:10px;padding:14px 18px;background:#0b1a2b;border-top:1px solid var(--line)}.composer input{flex:1;border:1px solid var(--line);background:#081522;color:white;padding:14px;border-radius:16px;outline:none}.send{width:55px;border:0;border-radius:16px;background:var(--accent);cursor:pointer;font-size:20px}.logout{margin:10px 14px 15px;padding:11px;border:1px solid var(--line);background:#081522;color:#ff9aaa;border-radius:12px;cursor:pointer}
@media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{position:absolute;inset:0 0 0 auto;width:86%;z-index:5;transform:translateX(0);transition:.2s}.sidebar.closed{transform:translateX(105%)}.chat{width:100%}.chat-head{padding:10px 14px}.messages{padding:16px}.bubble{max-width:84%}.menu{display:block!important}}
.menu{display:none;border:0;background:none;color:white;font-size:25px;cursor:pointer}
</style>
</head>
<body>
<section id="auth" class="auth">
  <div class="auth-card">
    <div class="logo">💬 Prime Chat</div>
    <div class="sub" id="authSub">أنشئ حسابك وابدأ محادثات خاصة</div>
    <form id="authForm">
      <div class="field"><label>اسم المستخدم</label><input id="username" autocomplete="username" required minlength="3"></div>
      <div class="field"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required minlength="6"></div>
      <button class="primary" id="authBtn">إنشاء حساب</button>
    </form>
    <button class="switch" id="switchBtn">عندي حساب بالفعل — تسجيل الدخول</button>
    <div class="error" id="authError"></div>
  </div>
</section>

<section id="app" class="app hidden">
  <aside id="sidebar" class="sidebar">
    <div class="side-head"><div class="brand">💬 Prime Chat</div></div>
    <div class="me" id="me"></div>
    <input class="search" id="search" placeholder="ابحث عن مستخدم...">
    <div class="users" id="users"></div>
    <button class="logout" id="logout">تسجيل الخروج</button>
  </aside>

  <main class="chat">
    <header class="chat-head">
      <button class="menu" id="menu">☰</button>
      <div class="avatar" id="chatAvatar">?</div>
      <div>
        <div class="chat-title" id="chatTitle">اختر شخصًا لبدء المحادثة</div>
        <div class="chat-status" id="chatStatus"></div>
      </div>
    </header>
    <div class="messages" id="messages">
      <div class="empty">اختار مستخدم من القائمة وابدأ الكلام 💬</div>
    </div>
    <form class="composer" id="composer">
      <input id="messageInput" maxlength="2000" placeholder="اكتب رسالة..." autocomplete="off" disabled>
      <button class="send" id="send" disabled>➤</button>
    </form>
  </main>
</section>

<script src="/socket.io/socket.io.js"></script>
<script>
const $=id=>document.getElementById(id);
let mode="register", token=localStorage.getItem("prime_token"), me=null, selected=null, users=[], socket=null, typingTimer=null;

function setAuthMode(){
  $("authSub").textContent=mode==="register"?"أنشئ حسابك وابدأ محادثات خاصة":"سجّل الدخول إلى حسابك";
  $("authBtn").textContent=mode==="register"?"إنشاء حساب":"تسجيل الدخول";
  $("switchBtn").textContent=mode==="register"?"عندي حساب بالفعل — تسجيل الدخول":"ليس لدي حساب — إنشاء حساب";
  $("authError").textContent="";
}
$("switchBtn").onclick=()=>{mode=mode==="register"?"login":"register";setAuthMode()};

$("authForm").onsubmit=async e=>{
  e.preventDefault(); $("authError").textContent="جاري المعالجة...";
  try{
    const r=await fetch(mode==="register"?"/api/register":"/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:$("username").value,password:$("password").value})});
    const d=await r.json(); if(!r.ok) throw new Error(d.error);
    token=d.token; localStorage.setItem("prime_token",token); await startApp();
  }catch(err){$("authError").textContent=err.message}
};

async function startApp(){
  try{
    const r=await fetch("/api/me",{headers:{Authorization:"Bearer "+token}});
    if(!r.ok) throw 0; me=await r.json();
    $("auth").classList.add("hidden");$("app").classList.remove("hidden");$("me").textContent="حسابك: "+me.username;
    connect(); await loadUsers();
  }catch{localStorage.removeItem("prime_token");token=null}
}

function connect(){
  socket=io({auth:{token}});
  socket.on("connect_error",()=>{});
  socket.on("presence",p=>{const u=users.find(x=>x.id===p.userId);if(u){u.online=p.online;if(p.lastSeen)u.lastSeen=p.lastSeen;renderUsers();if(selected?.id===u.id)updateHeader()}})
  socket.on("privateMessage",m=>{if(selected && (m.from===selected.id||m.to===selected.id)){renderMessage(m);scrollBottom()}});
  socket.on("typing",p=>{if(selected?.id===p.from)$("chatStatus").textContent=p.username+" يكتب الآن..."});
  socket.on("stopTyping",p=>{if(selected?.id===p.from)updateHeader()});
}

async function loadUsers(){
  const r=await fetch("/api/users",{headers:{Authorization:"Bearer "+token}});
  if(!r.ok) return; users=await r.json(); renderUsers();
}
function renderUsers(){
  const q=$("search").value.trim().toLowerCase();
  $("users").innerHTML="";
  users.filter(u=>u.username.toLowerCase().includes(q)).forEach(u=>{
    const b=document.createElement("button");b.className="user"+(selected?.id===u.id?" active":"");b.onclick=()=>selectUser(u);
    const av=document.createElement("div");av.className="avatar";av.textContent=u.username[0].toUpperCase();
    const info=document.createElement("div");info.className="uinfo";
    const n=document.createElement("div");n.className="uname";n.textContent=u.username;
    const s=document.createElement("div");s.className="status";s.innerHTML='<span class="dot '+(u.online?"on":"")+'"></span>'+(u.online?"متصل الآن":"غير متصل");
    info.append(n,s);b.append(av,info);$("users").appendChild(b);
  });
}
$("search").oninput=renderUsers;

async function selectUser(u){
  selected=u; renderUsers(); updateHeader(); $("messages").innerHTML="";
  $("messageInput").disabled=false;$("send").disabled=false;$("messageInput").focus();
  try{
    const r=await fetch("/api/messages/"+u.id,{headers:{Authorization:"Bearer "+token}});
    const data=await r.json(); data.forEach(renderMessage);scrollBottom();
  }catch{}
  if(innerWidth<=760)$("sidebar").classList.add("closed");
}
function updateHeader(){
  if(!selected)return;
  $("chatAvatar").textContent=selected.username[0].toUpperCase();
  $("chatTitle").textContent=selected.username;
  $("chatStatus").textContent=selected.online?"متصل الآن":"غير متصل";
}
function renderMessage(m){
  const d=document.createElement("div");d.className="bubble "+(m.from===me.id?"mine":"theirs");
  const t=document.createElement("div");t.textContent=m.text;
  const tm=document.createElement("div");tm.className="time";tm.textContent=new Date(m.createdAt).toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit"});
  d.append(t,tm);$("messages").appendChild(d);
}
function scrollBottom(){requestAnimationFrame(()=>$("messages").scrollTop=$("messages").scrollHeight)}
$("composer").onsubmit=e=>{
  e.preventDefault(); if(!selected||!socket)return;
  const text=$("messageInput").value.trim();if(!text)return;
  socket.emit("privateMessage",{to:selected.id,text});$("messageInput").value="";socket.emit("stopTyping",{to:selected.id});$("messageInput").focus();
};
$("messageInput").oninput=()=>{
  if(!selected||!socket)return;
  socket.emit("typing",{to:selected.id});clearTimeout(typingTimer);
  typingTimer=setTimeout(()=>socket.emit("stopTyping",{to:selected.id}),900);
};
$("logout").onclick=()=>{localStorage.removeItem("prime_token");location.reload()};
$("menu").onclick=()=>$("sidebar").classList.toggle("closed");

setAuthMode();
if(token)startApp();
</script>
</body>
</html>
